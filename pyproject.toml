[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-lab"
version = "0.1.0"
description = "Crypto Playground: Educational & Modern Cryptography Lab (Python)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crypto_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
